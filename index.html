:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e2d9;--acc:#4f46e5;--acc2:#eef0ff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}

.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,monospace;font-size:13px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}.item .s{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.bad{background:#fee2e2;color:var(--bad)}.tag.warn{background:#fef3c7;color:var(--warn)}.tag.ok{background:#dcfce7;color:var(--ok)}
.done .t{text-decoration:line-through;opacity:.5}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.empty{color:var(--mut);padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--acc2);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}
.mut{color:var(--mut);font-size:13px}

.calhead{padding:12px}.caltop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.caltitle{font-size:20px;font-weight:700;text-transform:capitalize;min-width:150px;text-align:center}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.legend{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.calwrap{padding:10px}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cell{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;background:var(--card);overflow:hidden;transition:border-color .15s}

.cell.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.dn{font-size:12px;color:var(--mut);width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;margin-bottom:2px}
.cell.today .dn{background:var(--acc);color:#fff;font-weight:700}
.les{font-size:11px;line-height:1.25;padding:2px 4px;border-radius:5px;margin-top:2px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les b{font-weight:600;opacity:.75}

.lcard{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border-left:4px solid;margin-bottom:8px;flex-wrap:wrap}
.lcard .t{flex:1;min-width:140px}.ltime{display:flex;flex-direction:column;font-size:13px;color:var(--mut);min-width:44px}.ltime b{color:var(--ink);font-size:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit;cursor:pointer}
.seg .s-went.on{background:#22c55e;color:#fff}.seg .s-missed.on{background:#ef4444;color:#fff}
details.add summary{cursor:pointer;color:var(--acc);margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.scard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}.sn{font-size:13px;color:var(--mut);min-height:34px}
.sp{font-size:28px;font-weight:700;margin:2px 0}.sc{display:flex;gap:12px;font-size:13px;margin-top:6px}

</style>
